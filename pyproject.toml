[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genecrispy"
version = "0.2.0"
description = "Local descriptive analysis tools for genetic sequences and molecular structures"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "GENE CRISpy contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
api = [
    "firebase-admin>=6.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
test = ["fastapi>=0.110.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["genecrispy*", "patientworld*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
